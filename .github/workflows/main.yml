name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "档案馆Android项目/gradlew" ]; then
            echo "dir=档案馆Android项目" >> "$GITHUB_OUTPUT"
          else
            echo "未找到 gradlew 构建脚本。"
            find . -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: archive-android-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
